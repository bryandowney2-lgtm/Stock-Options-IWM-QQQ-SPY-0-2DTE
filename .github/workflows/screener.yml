name: screener

on:
  workflow_dispatch:        # run manually from the Actions tab
  schedule:
    # 13:35 UTC = 9:35am ET during EDT — ~5 min after the open.
    # NOTE: GitHub cron is UTC and does NOT shift for daylight saving.
    # During EST (winter) this fires at 8:35am ET; adjust if that matters.
    - cron: "35 13 * * 1-5"

permissions:
  contents: write           # needed to commit the markdown output back

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Commit signal
        run: |
          git config user.name  "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add latest_signal.md
          if git diff --staged --quiet; then
            echo "No change in signal."
          else
            git commit -m "signal: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
